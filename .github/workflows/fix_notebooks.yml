name: Fix notebooks metadata (widgets.state)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.ipynb'

jobs:
  fix-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbformat

      - name: Run notebook fixer (add_state)
        run: |
          python scripts/fix_widgets_state.py --path . --mode add_state
        id: fixer

      - name: Show git status and diff
        run: |
          git status --porcelain
          git --no-pager diff || true

      - name: Commit & push changes (if any)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(notebooks): fix metadata.widgets (add state) [automated]" || echo "nothing to commit"
            git push
          else
            echo "No changes to commit"
          fi
